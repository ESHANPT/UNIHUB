<!doctype html>
<html lang="en" class="h-full" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UniHub — student dashboard for deadlines, timetable, reminders, and class announcements." />
    <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#E6E2DA" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UniHub" />
    <title>UniHub · Student Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var theme = localStorage.getItem('unihub:theme') || 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        var activeTheme = isDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', activeTheme);
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = activeTheme;
      } catch (error) {
        /* ignore theme bootstrap errors */
      }
    </script>
  </head>
  <body class="h-full bg-bg text-text antialiased font-sans">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
